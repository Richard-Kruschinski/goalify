services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goalify
      POSTGRES_PASSWORD: goalify
      POSTGRES_DB: goalify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalify"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://goalify:goalify@db:5432/goalify
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
